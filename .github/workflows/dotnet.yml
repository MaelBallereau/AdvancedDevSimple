name: .NET CI with Coverage

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            # 1️⃣ Télécharger le code
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Requis pour SonarQube (meilleure pertinence d'analyse)

            # 2️⃣ Installer .NET
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            # 3️⃣ Installer JDK 17 (requis par SonarQube)
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: 'zulu'

            # 4️⃣ Cache SonarQube Cloud packages
            - name: Cache SonarQube Cloud packages
              uses: actions/cache@v4
              with:
                  path: ~/.sonar/cache # ✅ Linux : ~ et / au lieu de ~\
                  key: ${{ runner.os }}-sonar
                  restore-keys: ${{ runner.os }}-sonar

            # 5️⃣ Cache du scanner
            - name: Cache SonarQube Cloud scanner
              id: cache-sonar-scanner
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/scanner # ✅ / au lieu de \
                  key: ${{ runner.os }}-sonar-scanner
                  restore-keys: ${{ runner.os }}-sonar-scanner

            # 6️⃣ Installer le scanner (si pas en cache)
            - name: Install SonarQube Cloud scanner
              if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
              # ✅ shell: bash au lieu de powershell, mkdir au lieu de New-Item
              run: |
                  mkdir -p ${{ runner.temp }}/scanner
                  dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

            # 7️⃣ Restaurer les dépendances
            - name: Restore dependencies
              run: dotnet restore

            # 8️⃣ Lancer l'analyse SonarQube + build + tests
            - name: Build and analyze
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              # ✅ shell: bash, chemins avec /, et ./ devant le binaire sur Linux
              run: |
                  ${{ runner.temp }}/scanner/dotnet-sonarscanner begin \
                    /k:"MaelBallereau_AdvancedDevSimple" \
                    /o:"maelballereau" \
                    /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
                    /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

                  dotnet build --no-restore

                  dotnet test --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

                  ${{ runner.temp }}/scanner/dotnet-sonarscanner end \
                    /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

            # 9️⃣ Installer ReportGenerator
            - name: Install ReportGenerator
              run: dotnet tool install -g dotnet-reportgenerator-globaltool

            # 🔟 Générer le rapport HTML
            - name: Generate coverage report
              run: |
                  reportgenerator \
                    -reports:**/coverage.opencover.xml \
                    -targetdir:coveragereport \
                    -reporttypes:Html

            # 1️⃣1️⃣ Sauvegarder le rapport comme artefact
            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coveragereport
